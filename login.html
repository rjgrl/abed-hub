<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ABED IDM Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light">
    <div
      class="min-vh-100 d-flex align-items-center justify-content-center px-4"
    >
      <div class="card p-4 shadow-sm w-100" style="max-width: 450px">
        <div class="text-center mb-6">
          <h3 class="fw-bold mb-2">ABED IDM Hub</h3>
          <h4 class="fw-bold">Welcome Back</h4>
          <p class="text-muted mt-1">Sign in to your account</p>
        </div>

        <div id="loginAlert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username or Email *</label>
            <input type="text" class="form-control" name="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password *</label>
            <input
              type="password"
              class="form-control"
              name="password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">
            Login
          </button>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted mb-2">
            Don't have an account?
            <a href="signup.html" class="link-primary text-decoration-none"
              >Sign up</a
            >
          </p>
          <a
            href="forgot-password.html"
            class="link-primary text-decoration-none"
            >Forgot password?</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const formData = new FormData(this);

          fetch("login.php", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              const alertDiv = document.getElementById("loginAlert");
              if (data.status === "success") {
                alertDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                setTimeout(
                  () => (window.location.href = "dashboard.html"),
                  1500,
                );
              } else {
                alertDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              document.getElementById("loginAlert").innerHTML =
                `<div class="alert alert-danger">An error occurred. Please try again.</div>`;
            });
        });
    </script>
  </body>
</html>
