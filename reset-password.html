<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - ABED IDM Hub</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * {
        transition: all 0.3s ease;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .auth-container {
        width: 100%;
        padding: 20px;
      }

      .auth-card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 450px;
        margin: 0 auto;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px 10px 0 0;
        padding: 40px 30px;
        text-align: center;
      }

      .auth-header-icon {
        font-size: 48px;
        margin-bottom: 15px;
        opacity: 0.9;
      }

      .auth-header h3 {
        margin-bottom: 10px;
        font-size: 26px;
        font-weight: 700;
      }

      .auth-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.85;
        line-height: 1.5;
      }

      .card-body {
        padding: 40px;
      }

      .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
      }

      .form-label i {
        margin-right: 8px;
        color: #667eea;
        width: 16px;
      }

      .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 14px;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
      }

      .input-group-text {
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        color: #667eea;
        font-weight: 600;
        cursor: pointer;
      }

      .input-group-text:hover {
        background-color: #e9ecef;
      }

      .password-strength {
        height: 4px;
        border-radius: 2px;
        margin-top: 5px;
        background-color: #e0e0e0;
        overflow: hidden;
      }

      .password-strength-meter {
        height: 100%;
        width: 0%;
        transition: all 0.3s ease;
      }

      .strength-weak {
        background-color: #dc3545;
      }

      .strength-fair {
        background-color: #ffc107;
      }

      .strength-good {
        background-color: #17a2b8;
      }

      .strength-strong {
        background-color: #28a745;
      }

      .strength-text {
        font-size: 12px;
        margin-top: 4px;
        font-weight: 600;
      }

      .text-danger {
        color: #dc3545 !important;
      }

      .text-warning {
        color: #ffc107 !important;
      }

      .text-info {
        color: #17a2b8 !important;
      }

      .text-success {
        color: #28a745 !important;
      }

      .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 8px;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      .btn-back {
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        color: #667eea;
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-back:hover {
        background-color: #e9ecef;
        border-color: #667eea;
        color: #667eea;
      }

      .alert {
        border: none;
        border-radius: 8px;
        animation: slideDown 0.3s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer-text {
        text-align: center;
        margin-top: 30px;
        color: white;
        font-size: 12px;
      }

      .divider {
        margin: 25px 0;
      }

      @media (max-width: 576px) {
        .auth-card {
          max-width: 100%;
        }

        .card-body {
          padding: 25px;
        }

        .auth-header {
          padding: 30px 20px;
        }

        .auth-header h3 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="auth-header">
          <div class="auth-header-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h3>Create New Password</h3>
          <p>Enter your new password below</p>
        </div>

        <div class="card-body">
          <div id="alertContainer"></div>

          <form id="resetPasswordForm">
            <div class="mb-4">
              <label class="form-label">
                <i class="fas fa-lock"></i>New Password
              </label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="newPassword"
                  name="newPassword"
                  placeholder="Enter new password"
                  required
                />
                <span
                  class="input-group-text"
                  onclick="togglePassword('newPassword')"
                  title="Show/Hide Password"
                >
                  <i class="fas fa-eye"></i>
                </span>
              </div>
              <div class="password-strength">
                <div class="password-strength-meter" id="strengthMeter"></div>
              </div>
              <small class="strength-text" id="strengthText"></small>
            </div>

            <div class="mb-3">
              <label class="form-label">
                <i class="fas fa-check-circle"></i>Confirm Password
              </label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm password"
                  required
                />
                <span
                  class="input-group-text"
                  onclick="togglePassword('confirmPassword')"
                  title="Show/Hide Password"
                >
                  <i class="fas fa-eye"></i>
                </span>
              </div>
              <small class="text-muted" id="matchText"></small>
            </div>

            <!-- Password Requirements Checklist -->
            <div class="mb-4" style="font-size: 12px">
              <div style="margin-bottom: 5px">
                <i
                  class="fas fa-check-circle"
                  id="check-length"
                  style="color: #ccc"
                ></i>
                At least 8 characters
              </div>
              <div style="margin-bottom: 5px">
                <i
                  class="fas fa-check-circle"
                  id="check-upper"
                  style="color: #ccc"
                ></i>
                At least one uppercase letter
              </div>
              <div style="margin-bottom: 5px">
                <i
                  class="fas fa-check-circle"
                  id="check-number"
                  style="color: #ccc"
                ></i>
                At least one number
              </div>
              <div>
                <i
                  class="fas fa-check-circle"
                  id="check-special"
                  style="color: #ccc"
                ></i>
                At least one special character (!@#$%^&*)
              </div>
            </div>

            <button type="submit" class="btn btn-submit w-100 mb-2">
              <i class="fas fa-key me-2"></i>Reset Password
            </button>

            <button
              type="button"
              class="btn btn-back w-100"
              onclick="window.location.href = 'login.html'"
            >
              <i class="fas fa-arrow-left me-2"></i>Back to Login
            </button>
          </form>

          <div class="divider"></div>

          <div class="text-center">
            <p class="text-muted small mb-0">
              <i class="fas fa-shield-alt"></i> Your password will be encrypted
              and secured
            </p>
          </div>
        </div>
      </div>

      <div class="footer-text">
        <small>&copy; 2026 ABED IDM Hub. All rights reserved.</small>
      </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const strengthMeter = document.getElementById("strengthMeter");
      const strengthText = document.getElementById("strengthText");
      const matchText = document.getElementById("matchText");

      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        showAlert("Invalid session. Please start over.", "danger");
        setTimeout(() => {
          window.location.href = "forgot-password.html";
        }, 2000);
      }

      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = field.type === "password" ? "text" : "password";
      }

      // Password strength checker
      newPasswordInput.addEventListener("input", function () {
        const password = this.value;
        let strength = 0;
        let requirements = {
          length: password.length >= 8,
          uppercase: /[A-Z]/.test(password),
          number: /\d/.test(password),
          special: /[!@#$%^&*]/.test(password),
        };

        // Update checklist
        updateCheckIcon("check-length", requirements.length);
        updateCheckIcon("check-upper", requirements.uppercase);
        updateCheckIcon("check-number", requirements.number);
        updateCheckIcon("check-special", requirements.special);

        // Calculate strength
        if (requirements.length) strength += 25;
        if (requirements.uppercase) strength += 25;
        if (requirements.number) strength += 25;
        if (requirements.special) strength += 25;

        // Update strength meter
        strengthMeter.style.width = strength + "%";
        strengthMeter.className = "password-strength-meter";

        if (strength < 50) {
          strengthMeter.classList.add("strength-weak");
          strengthText.textContent = "Weak Password";
          strengthText.className = "strength-text text-danger";
        } else if (strength < 75) {
          strengthMeter.classList.add("strength-fair");
          strengthText.textContent = "Fair Password";
          strengthText.className = "strength-text text-warning";
        } else if (strength < 100) {
          strengthMeter.classList.add("strength-good");
          strengthText.textContent = "Good Password";
          strengthText.className = "strength-text text-info";
        } else {
          strengthMeter.classList.add("strength-strong");
          strengthText.textContent = "Strong Password";
          strengthText.className = "strength-text text-success";
        }

        // Check password match
        checkPasswordMatch();
      });

      confirmPasswordInput.addEventListener("input", checkPasswordMatch);

      function checkPasswordMatch() {
        if (
          newPasswordInput.value &&
          confirmPasswordInput.value &&
          newPasswordInput.value === confirmPasswordInput.value
        ) {
          matchText.textContent = "✓ Passwords match";
          matchText.className = "text-success";
        } else if (
          newPasswordInput.value &&
          confirmPasswordInput.value &&
          newPasswordInput.value !== confirmPasswordInput.value
        ) {
          matchText.textContent = "✗ Passwords do not match";
          matchText.className = "text-danger";
        } else {
          matchText.textContent = "";
        }
      }

      function updateCheckIcon(elementId, isValid) {
        const element = document.getElementById(elementId);
        if (isValid) {
          element.style.color = "#28a745";
        } else {
          element.style.color = "#ccc";
        }
      }

      // Form submission
      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Validate passwords match
          if (newPasswordInput.value !== confirmPasswordInput.value) {
            showAlert("Passwords do not match. Please try again.", "danger");
            return;
          }

          const formData = new FormData();
          formData.append("token", token);
          formData.append("newPassword", newPasswordInput.value);

          // Show loading state
          const submitBtn = this.querySelector('button[type="submit"]');
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>Resetting Password...';

          fetch("reset-password.php", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                showAlert(
                  "Password reset successfully! Redirecting to login...",
                  "success",
                );
                setTimeout(() => {
                  window.location.href = "login.html";
                }, 2000);
              } else {
                showAlert(data.message, "danger");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              showAlert("An error occurred. Please try again.", "danger");
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalText;
            });
        });

      function showAlert(message, type) {
        const alertContainer = document.getElementById("alertContainer");
        const alertHTML = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="fas fa-${
              type === "success" ? "check-circle" : "exclamation-circle"
            } me-2"></i>${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
        alertContainer.innerHTML = alertHTML;
        alertContainer.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    </script>
  </body>
</html>
