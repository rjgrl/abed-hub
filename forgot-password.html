<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - ABED IDM Hub</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * {
        transition: all 0.3s ease;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .auth-container {
        width: 100%;
        padding: 20px;
      }

      .auth-card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 450px;
        margin: 0 auto;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px 10px 0 0;
        padding: 40px 30px;
        text-align: center;
      }

      .auth-header-icon {
        font-size: 48px;
        margin-bottom: 15px;
        opacity: 0.9;
      }

      .auth-header h3 {
        margin-bottom: 10px;
        font-size: 26px;
        font-weight: 700;
      }

      .auth-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.85;
        line-height: 1.5;
      }

      .card-body {
        padding: 40px;
      }

      .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
      }

      .form-label i {
        margin-right: 8px;
        color: #667eea;
        width: 16px;
      }

      .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 14px;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
      }

      .input-group-text {
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        color: #667eea;
        font-weight: 600;
      }

      .input-group .form-control:focus + .input-group-text {
        border-color: #667eea;
      }

      .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 8px;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      .btn-back {
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        color: #667eea;
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-back:hover {
        background-color: #e9ecef;
        border-color: #667eea;
        color: #667eea;
      }

      .help-text {
        font-size: 13px;
        color: #6c757d;
        margin-top: 10px;
        line-height: 1.5;
      }

      .alert {
        border: none;
        border-radius: 8px;
        animation: slideDown 0.3s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .link-style {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .link-style:hover {
        color: #764ba2;
        text-decoration: underline;
      }

      .footer-text {
        text-align: center;
        margin-top: 30px;
        color: white;
        font-size: 12px;
      }

      .divider {
        margin: 25px 0;
      }

      @media (max-width: 576px) {
        .auth-card {
          max-width: 100%;
        }

        .card-body {
          padding: 25px;
        }

        .auth-header {
          padding: 30px 20px;
        }

        .auth-header h3 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="auth-header">
          <div class="auth-header-icon">
            <i class="fas fa-key"></i>
          </div>
          <h3>Password Recovery</h3>
          <p>Enter your email address to receive a recovery code</p>
        </div>

        <div class="card-body">
          <div id="alertContainer"></div>

          <form id="forgotPasswordForm">
            <div class="mb-4">
              <label class="form-label">
                <i class="fas fa-envelope"></i>Email Address
              </label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-at"></i>
                </span>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  placeholder="your.email@abed.gov.ph"
                  required
                />
              </div>
              <div class="help-text">
                <i class="fas fa-info-circle"></i> We'll send a verification
                code to this email address
              </div>
            </div>

            <button type="submit" class="btn btn-submit w-100 mb-2">
              <i class="fas fa-paper-plane me-2"></i>Send Recovery Code
            </button>

            <button
              type="button"
              class="btn btn-back w-100"
              onclick="window.location.href = 'login.html'"
            >
              <i class="fas fa-arrow-left me-2"></i>Back to Login
            </button>
          </form>

          <div class="divider"></div>

          <div class="text-center">
            <p class="text-muted small mb-2">
              Don't have an account?
              <a href="signup.html" class="link-style">Sign up here</a>
            </p>
            <p class="text-muted small mb-0">
              <i class="fas fa-shield-alt"></i> Your data is secure and
              encrypted
            </p>
          </div>
        </div>
      </div>

      <div class="footer-text">
        <small>&copy; 2026 ABED IDM Hub. All rights reserved.</small>
      </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.querySelector('input[name="email"]').value;
          const formData = new FormData();
          formData.append("email", email);

          // Show loading state
          const submitBtn = this.querySelector('button[type="submit"]');
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

          fetch("forgot-password.php", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                showAlert(
                  "Recovery code sent! Check your email and enter the code on the next page.",
                  "success",
                );
                setTimeout(() => {
                  window.location.href =
                    "verify-code.html?email=" + encodeURIComponent(email);
                }, 2000);
              } else {
                showAlert(data.message, "danger");
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              showAlert("An error occurred. Please try again.", "danger");
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalText;
            });
        });

      function showAlert(message, type) {
        const alertContainer = document.getElementById("alertContainer");
        const alertHTML = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="fas fa-${
              type === "success" ? "check-circle" : "exclamation-circle"
            } me-2"></i>${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
        alertContainer.innerHTML = alertHTML;
        alertContainer.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    </script>
  </body>
</html>
