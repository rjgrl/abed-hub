<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ABED IDM Hub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div
      class="min-vh-100 d-flex align-items-center justify-content-center px-4 py-4"
    >
      <div class="card p-4 shadow-sm w-100" style="max-width: 600px">
        <div class="text-center mb-4">
          <h3 class="fw-bold mb-2">ABED IDM Hub</h3>
          <h4 class="fw-bold">Create Account</h4>
          <p class="text-muted">Join us today</p>
        </div>

        <div id="signupAlert"></div>

        <form id="signupForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Full Name *</label>
              <input
                type="text"
                class="form-control"
                name="fullName"
                required
              />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Employee ID *</label>
              <input
                type="text"
                class="form-control"
                name="employeeId"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" name="email" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Username *</label>
            <input type="text" class="form-control" name="username" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Office Unit *</label>
            <input
              type="text"
              class="form-control"
              name="officeUnit"
              placeholder="e.g., BKSP, LGED"
              required
            />
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Password *</label>
              <input
                type="password"
                class="form-control"
                name="password"
                required
              />
              <small class="text-muted">Min 8 chars, uppercase, numbers</small>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Confirm Password *</label>
              <input
                type="password"
                class="form-control"
                name="confirmPassword"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>

        <div class="text-center mt-3">
          <p class="text-muted">
            Already have an account?
            <a href="login.html" class="link-primary text-decoration-none"
              >Login</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const formData = new FormData(this);

          fetch("signup.php", {
            method: "POST",
            body: formData,
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.status === "success") {
                document.getElementById("signupAlert").innerHTML =
                  `<div class="alert alert-success">${data.message}</div>`;
                setTimeout(() => (window.location.href = "login.html"), 2000);
              } else {
                document.getElementById("signupAlert").innerHTML =
                  `<div class="alert alert-danger">${data.message}</div>`;
              }
            })
            .catch((error) => {
              console.error("Error:", error);
              document.getElementById("signupAlert").innerHTML =
                `<div class="alert alert-danger">An error occurred</div>`;
            });
        });
    </script>
  </body>
</html>
