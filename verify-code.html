<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Code - ABED IDM Hub</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * {
        transition: all 0.3s ease;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .auth-container {
        width: 100%;
        padding: 20px;
      }

      .auth-card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 450px;
        margin: 0 auto;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 10px 10px 0 0;
        padding: 40px 30px;
        text-align: center;
      }

      .auth-header-icon {
        font-size: 48px;
        margin-bottom: 15px;
        opacity: 0.9;
      }

      .auth-header h3 {
        margin-bottom: 10px;
        font-size: 26px;
        font-weight: 700;
      }

      .auth-header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.85;
        line-height: 1.5;
      }

      .card-body {
        padding: 40px;
      }

      .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
      }

      .form-label i {
        margin-right: 8px;
        color: #667eea;
        width: 16px;
      }

      .otp-input-group {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 20px 0;
      }

      .otp-input {
        width: 60px;
        height: 60px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        color: #667eea;
        transition: all 0.3s ease;
      }

      .otp-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
      }

      .otp-input.error {
        border-color: #dc3545;
        animation: shake 0.3s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 14px;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
      }

      .btn-submit {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 12px;
        font-weight: 600;
        border-radius: 8px;
        color: white;
        transition: all 0.3s ease;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      .btn-back {
        background-color: #f8f9fa;
        border: 2px solid #e0e0e0;
        color: #667eea;
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-back:hover {
        background-color: #e9ecef;
        border-color: #667eea;
        color: #667eea;
      }

      .help-text {
        font-size: 13px;
        color: #6c757d;
        margin-top: 10px;
        line-height: 1.5;
        text-align: center;
      }

      .timer {
        font-weight: bold;
        color: #dc3545;
      }

      .resend-link {
        color: #667eea;
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
      }

      .resend-link:hover {
        text-decoration: underline;
      }

      .resend-link.disabled {
        color: #adb5bd;
        cursor: not-allowed;
      }

      .alert {
        border: none;
        border-radius: 8px;
        animation: slideDown 0.3s ease-out;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer-text {
        text-align: center;
        margin-top: 30px;
        color: white;
        font-size: 12px;
      }

      .divider {
        margin: 25px 0;
      }

      @media (max-width: 576px) {
        .auth-card {
          max-width: 100%;
        }

        .card-body {
          padding: 25px;
        }

        .auth-header {
          padding: 30px 20px;
        }

        .auth-header h3 {
          font-size: 22px;
        }

        .otp-input-group {
          gap: 5px;
        }

        .otp-input {
          width: 50px;
          height: 50px;
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="auth-header">
          <div class="auth-header-icon">
            <i class="fas fa-check-square"></i>
          </div>
          <h3>Verify Code</h3>
          <p>Enter the 6-digit code sent to your email</p>
        </div>

        <div class="card-body">
          <div id="alertContainer"></div>

          <form id="verifyCodeForm">
            <div class="mb-4">
              <label class="form-label">
                <i class="fas fa-lock"></i>Recovery Code
              </label>
              <div class="otp-input-group" id="otpGroup">
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="0"
                />
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="1"
                />
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="2"
                />
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="3"
                />
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="4"
                />
                <input
                  type="text"
                  class="otp-input"
                  maxlength="1"
                  placeholder="0"
                  data-index="5"
                />
              </div>
              <div class="help-text">
                Code expires in <span class="timer" id="timer">30:00</span>
              </div>
            </div>

            <button type="submit" class="btn btn-submit w-100 mb-2">
              <i class="fas fa-check me-2"></i>Verify Code
            </button>

            <button
              type="button"
              class="btn btn-back w-100"
              onclick="window.location.href = 'login.html'"
            >
              <i class="fas fa-arrow-left me-2"></i>Back to Login
            </button>
          </form>

          <div class="divider"></div>

          <div class="help-text">
            Didn't receive the code?
            <span class="resend-link" id="resendLink" onclick="resendCode()">
              Resend Code
            </span>
          </div>
        </div>
      </div>

      <div class="footer-text">
        <small>&copy; 2026 ABED IDM Hub. All rights reserved.</small>
      </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      const otpInputs = document.querySelectorAll(".otp-input");
      const verifyForm = document.getElementById("verifyCodeForm");
      const timerElement = document.getElementById("timer");
      const resendLink = document.getElementById("resendLink");
      let timeRemaining = 1800; // 30 minutes

      // Get email from URL
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get("email");

      if (!email) {
        showAlert("Invalid session. Please start over.", "danger");
        setTimeout(() => {
          window.location.href = "forgot-password.html";
        }, 2000);
      }

      // OTP input handling
      otpInputs.forEach((input) => {
        input.addEventListener("input", (e) => {
          if (e.target.value.length > 0) {
            const nextIndex = parseInt(e.target.dataset.index) + 1;
            if (nextIndex < otpInputs.length) {
              otpInputs[nextIndex].focus();
            }
          }
          e.target.classList.remove("error");
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && e.target.value.length === 0) {
            const prevIndex = parseInt(e.target.dataset.index) - 1;
            if (prevIndex >= 0) {
              otpInputs[prevIndex].focus();
            }
          }
        });

        input.addEventListener("paste", (e) => {
          e.preventDefault();
          const pastedData = e.clipboardData.getData("text").slice(0, 6);
          pastedData.split("").forEach((char, index) => {
            if (index < otpInputs.length) {
              otpInputs[index].value = char;
            }
          });
          if (pastedData.length === 6) {
            otpInputs[5].focus();
          }
        });
      });

      // Timer countdown
      setInterval(() => {
        timeRemaining--;

        if (timeRemaining <= 0) {
          timerElement.textContent = "Expired";
          verifyForm.style.opacity = "0.5";
          verifyForm.style.pointerEvents = "none";
          showAlert("Code expired. Please request a new one.", "danger");
          return;
        }

        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timerElement.textContent = `${minutes}:${seconds
          .toString()
          .padStart(2, "0")}`;
      }, 1000);

      // Form submission
      verifyForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const code = Array.from(otpInputs)
          .map((input) => input.value)
          .join("");

        if (code.length !== 6) {
          showAlert("Please enter the complete 6-digit code", "warning");
          otpInputs.forEach((input) => input.classList.add("error"));
          return;
        }

        const formData = new FormData();
        formData.append("email", email);
        formData.append("code", code);

        const submitBtn = verifyForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';

        fetch("verify-code.php", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              showAlert(
                "Code verified! Redirecting to reset password...",
                "success",
              );
              setTimeout(() => {
                window.location.href =
                  "reset-password.html?token=" + encodeURIComponent(data.token);
              }, 2000);
            } else {
              showAlert(data.message, "danger");
              otpInputs.forEach((input) => {
                input.value = "";
                input.classList.add("error");
              });
              otpInputs[0].focus();
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalText;
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            showAlert("An error occurred. Please try again.", "danger");
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          });
      });

      function resendCode() {
        if (resendLink.classList.contains("disabled")) {
          return;
        }

        const formData = new FormData();
        formData.append("email", email);

        resendLink.style.opacity = "0.5";
        resendLink.classList.add("disabled");

        fetch("forgot-password.php", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              showAlert("New code sent to your email!", "success");
              timeRemaining = 1800; // Reset timer
              otpInputs.forEach((input) => {
                input.value = "";
                input.classList.remove("error");
              });
              otpInputs[0].focus();

              // Disable resend for 60 seconds
              let resendTimer = 60;
              const resendInterval = setInterval(() => {
                resendTimer--;
                if (resendTimer <= 0) {
                  clearInterval(resendInterval);
                  resendLink.style.opacity = "1";
                  resendLink.classList.remove("disabled");
                } else {
                  resendLink.textContent = `Resend Code (${resendTimer}s)`;
                }
              }, 1000);
            } else {
              showAlert(data.message, "danger");
              resendLink.style.opacity = "1";
              resendLink.classList.remove("disabled");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            showAlert("Failed to resend code", "danger");
            resendLink.style.opacity = "1";
            resendLink.classList.remove("disabled");
          });
      }

      function showAlert(message, type) {
        const alertContainer = document.getElementById("alertContainer");
        const alertHTML = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="fas fa-${
              type === "success"
                ? "check-circle"
                : type === "warning"
                  ? "exclamation-triangle"
                  : "exclamation-circle"
            } me-2"></i>${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
        alertContainer.innerHTML = alertHTML;
        alertContainer.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      // Focus first input on load
      otpInputs[0].focus();
    </script>
  </body>
</html>
